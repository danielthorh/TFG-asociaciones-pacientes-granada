<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Artículos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #c8f060;
      --accent-dim: #8faa3a;
      --text: #f0ede6;
      --muted: #7a7a7a;
      --error: #ff6b6b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 20% 20%, #1e2a0a22 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, #0a1a2a22 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 760px;
      position: relative;
      z-index: 1;
    }

    header {
      margin-bottom: 56px;
      animation: fadeDown 0.6s ease both;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 2px;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 14px;
      font-size: 15px;
      color: var(--muted);
      font-weight: 300;
      line-height: 1.6;
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .field {
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      transition: border-color 0.2s;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="text"]::placeholder {
      color: #3a3a3a;
    }

    select:focus {
      border-color: var(--accent);
    }

    .tipo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .tipo-opcion {
      position: relative;
    }

    .tipo-opcion input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
    }

    .tipo-opcion label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      text-transform: none;
      letter-spacing: normal;
      font-size: 14px;
      color: var(--text);
    }

    .tipo-opcion label .tipo-desc {
      font-size: 12px;
      color: var(--muted);
      font-weight: 300;
    }

    .tipo-opcion input:checked + label {
      border-color: var(--accent);
      background: #1e2a0a;
    }

    .tipo-opcion label:hover {
      border-color: var(--accent-dim);
    }

    button[type="submit"] {
      width: 100%;
      background: var(--accent);
      color: #0f0f0f;
      border: none;
      border-radius: 8px;
      padding: 16px;
      font-size: 15px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.02em;
      margin-top: 8px;
    }

    button[type="submit"]:hover {
      opacity: 0.9;
    }

    button[type="submit"]:active {
      transform: scale(0.99);
    }

    button[type="submit"]:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 48px 0;
      animation: fadeUp 0.4s ease both;
    }

    .loading.visible { display: flex; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      font-size: 14px;
      color: var(--muted);
    }

    .loading-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      opacity: 0.4;
      transition: opacity 0.4s;
    }

    .step.active { opacity: 1; color: var(--text); }
    .step.done { opacity: 0.6; color: var(--accent); }

    .step-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .resultado {
      display: none;
      margin-top: 32px;
      animation: fadeUp 0.5s ease both;
    }

    .resultado.visible { display: block; }

    .resultado-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .resultado-titulo {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .btn-copiar {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      padding: 6px 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-copiar:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .articulo-texto {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 600px;
      overflow-y: auto;
    }

    .articulo-texto::-webkit-scrollbar { width: 4px; }
    .articulo-texto::-webkit-scrollbar-track { background: transparent; }
    .articulo-texto::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .archivo-guardado {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .archivo-guardado span { color: var(--accent); }

    .error-msg {
      display: none;
      background: #2a1010;
      border: 1px solid var(--error);
      border-radius: 8px;
      padding: 16px 20px;
      color: var(--error);
      font-size: 13px;
      margin-top: 16px;
    }

    .error-msg.visible { display: block; }

    .btn-nuevo {
      display: none;
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      margin-top: 16px;
    }

    .btn-nuevo:hover { border-color: var(--accent); color: var(--accent); }
    .btn-nuevo.visible { display: block; }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="tag">Generador IA</div>
      <h1>Crea tu próximo<br /><span>artículo</span> en segundos</h1>
      <p class="subtitle">Introduce el tema, la asociación y el tipo de artículo.<br />El resto lo hace la IA.</p>
    </header>

    <div class="form-card">
      <form id="form">
        <div class="field">
          <label for="tema">¿Sobre qué quieres escribir?</label>
          <input
            type="text"
            id="tema"
            placeholder="Ej: convivencia con el autismo, qué es la diabetes..."
            autocomplete="off"
            required
          />
        </div>

        <div class="field">
          <label for="asociacion">Asociación</label>
          <select id="asociacion" required style="width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:14px 18px; font-size:15px; font-family:'DM Sans', sans-serif; color:var(--text); outline:none;">
            <option value="" disabled selected>Selecciona una asociación</option>
            <option value="22Q-ANDALUCIA">22Q-ANDALUCIA</option>
            <option value="ACCU">ACCU</option>
            <option value="ACEGRA">ACEGRA</option>
            <option value="ADAEC">ADAEC</option>
            <option value="ADANER">ADANER</option>
            <option value="AEEC">AEEC</option>
            <option value="AESPI">AESPI</option>
            <option value="AGDEM">AGDEM</option>
            <option value="AGRADI">AGRADI</option>
            <option value="AGRAELA">AGRAELA</option>
            <option value="AGRAFIM">AGRAFIM</option>
            <option value="AIRE LIBRE">AIRE LIBRE</option>
            <option value="ALCER">ALCER</option>
            <option value="AOGRA">AOGRA</option>
            <option value="ASANHEMO">ASANHEMO</option>
            <option value="ASEMGRA">ASEMGRA</option>
            <option value="ASGRADIM">ASGRADIM</option>
            <option value="ASPACE">ASPACE</option>
            <option value="ASPRODES">ASPRODES</option>
            <option value="DOWN">DOWN</option>
            <option value="FEGRADI">FEGRADI</option>
            <option value="FQ-ANDALUCIA">FQ-ANDALUCIA</option>
            <option value="FRATER">FRATER</option>
            <option value="GAEN">GAEN</option>
            <option value="GRANABIP">GRANABIP</option>
            <option value="PANIDE">PANIDE</option>
            <option value="PARKINSON">PARKINSON</option>
            <option value="PREGRAN">PREGRAN</option>
            <option value="SAPAME">SAPAME</option>
            <option value="SEQUIM">SEQUIM</option>
            <option value="VIVIR CON CORAZON">VIVIR CON CORAZON</option>
          </select>
        </div>

        <div class="field">
          <label>Tipo de artículo</label>
          <div class="tipo-grid">
            <div class="tipo-opcion">
              <input type="radio" name="tipo" id="tipo-condicion" value="condicion" checked />
              <label for="tipo-condicion">
                Condición médica
                <span class="tipo-desc">Qué es, síntomas, qué hacer</span>
              </label>
            </div>
            <div class="tipo-opcion">
              <input type="radio" name="tipo" id="tipo-convivencia" value="convivencia" />
              <label for="tipo-convivencia">
                Convivencia
                <span class="tipo-desc">Cómo apoyar, qué evitar, día a día</span>
              </label>
            </div>
          </div>
        </div>

        <button type="submit" id="btn-generar">Generar artículo →</button>
      </form>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-steps">
          <div class="step" id="step1"><div class="step-dot"></div>Buscando contexto en los documentos...</div>
          <div class="step" id="step2"><div class="step-dot"></div>Generando borrador con llama3.2...</div>
          <div class="step" id="step3"><div class="step-dot"></div>Revisando y corrigiendo con Gemini...</div>
          <div class="step" id="step4"><div class="step-dot"></div>Guardando artículo...</div>
        </div>
      </div>

      <div class="error-msg" id="error-msg"></div>
    </div>

    <div class="resultado" id="resultado">
      <div class="resultado-header">
        <span class="resultado-titulo">Artículo generado</span>
        <button class="btn-copiar" id="btn-copiar">Copiar texto</button>
      </div>
      <div class="articulo-texto" id="articulo-texto"></div>
      <div class="archivo-guardado" id="archivo-guardado">
        💾 Guardado en <span id="ruta-archivo"></span>
      </div>
    </div>

    <button class="btn-nuevo" id="btn-nuevo">+ Generar otro artículo</button>
  </div>

  <script>
    const form = document.getElementById('form');
    const btnGenerar = document.getElementById('btn-generar');
    const loading = document.getElementById('loading');
    const resultado = document.getElementById('resultado');
    const articuloTexto = document.getElementById('articulo-texto');
    const errorMsg = document.getElementById('error-msg');
    const btnCopiar = document.getElementById('btn-copiar');
    const btnNuevo = document.getElementById('btn-nuevo');
    const rutaArchivo = document.getElementById('ruta-archivo');

    const steps = [
      document.getElementById('step1'),
      document.getElementById('step2'),
      document.getElementById('step3'),
      document.getElementById('step4'),
    ];

    let stepInterval = null;

    function iniciarSteps() {
      let i = 0;
      steps.forEach(s => s.className = 'step');
      steps[0].classList.add('active');
      stepInterval = setInterval(() => {
        if (i < steps.length - 1) {
          steps[i].classList.remove('active');
          steps[i].classList.add('done');
          i++;
          steps[i].classList.add('active');
        }
      }, 4000);
    }

    function detenerSteps() {
      clearInterval(stepInterval);
      steps.forEach(s => s.classList.add('done'));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const tema = document.getElementById('tema').value.trim();
      const tipo = document.querySelector('input[name="tipo"]:checked').value;
      const asociacion = document.getElementById('asociacion').value;

      errorMsg.className = 'error-msg';
      resultado.className = 'resultado';
      btnNuevo.className = 'btn-nuevo';

      btnGenerar.disabled = true;
      loading.classList.add('visible');
      iniciarSteps();

      try {
        const res = await fetch('http://localhost:5000/generar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tema, tipo, asociacion })
        });

        const data = await res.json();

        detenerSteps();
        loading.classList.remove('visible');

        if (!res.ok || data.error) {
          errorMsg.textContent = '❌ Error: ' + (data.error || 'Algo salió mal');
          errorMsg.classList.add('visible');
          btnGenerar.disabled = false;
          return;
        }

        articuloTexto.textContent = data.articulo_borrador;
        rutaArchivo.textContent = data.archivo_borrador;
        resultado.classList.add('visible');
        btnNuevo.classList.add('visible');

      } catch (err) {
        detenerSteps();
        loading.classList.remove('visible');
        errorMsg.textContent = '❌ No se pudo conectar con el servidor. ¿Está ejecutándose servidor.py?';
        errorMsg.classList.add('visible');
        btnGenerar.disabled = false;
      }
    });

    btnCopiar.addEventListener('click', () => {
      navigator.clipboard.writeText(articuloTexto.textContent);
      btnCopiar.textContent = '✓ Copiado';
      setTimeout(() => btnCopiar.textContent = 'Copiar texto', 2000);
    });

    btnNuevo.addEventListener('click', () => {
      form.reset();
      resultado.className = 'resultado';
      btnNuevo.className = 'btn-nuevo';
      errorMsg.className = 'error-msg';
      btnGenerar.disabled = false;
      document.getElementById('tema').focus();
    });
  </script>
</body>
</html>
